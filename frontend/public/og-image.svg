<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo lockup (top-left) -->
  <g transform="translate(80, 76)">
    <rect width="52" height="52" rx="12" fill="#ffffff"/>
    <text x="26" y="37" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0a0a0a">Q</text>
    <text x="68" y="34" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Quotely</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80, 220)">
    <text font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2.5">
      <tspan x="0" dy="0">Close your sale</tspan>
      <tspan x="0" dy="92">in <tspan fill="#737373">60 seconds</tspan>.</tspan>
    </text>
  </g>

  <!-- Subline -->
  <text x="80" y="470" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#a3a3a3">
    AI Quotation Software for Service Businesses · India
  </text>

  <!-- Pill row (bottom-left) -->
  <g transform="translate(80, 525)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff">
    <g>
      <rect width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
      <text x="22" y="26">60-second AI quotes</text>
    </g>
    <g transform="translate(220, 0)">
      <rect width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
      <text x="22" y="26">GST + HSN ready</text>
    </g>
    <g transform="translate(410, 0)">
      <rect width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
      <text x="22" y="26">Made in India</text>
    </g>
  </g>

  <!-- URL (bottom-right) -->
  <text x="1120" y="555" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#a3a3a3" text-anchor="end">quotelypro.in</text>
</svg>
